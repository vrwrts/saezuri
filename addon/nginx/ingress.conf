# Home Assistant ingress listener, installed into /etc/nginx/conf.d/ by run.sh.
# The Supervisor strips its /api/hassio_ingress/<token> prefix before proxying,
# so requests arrive root-anchored and this block can include the very same
# locations as the standalone port-80 listener. The prefix still matters to the
# browser, which has to build its own URLs, so it is injected into the document.
server {
    listen 8099;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Ingress is the Supervisor's own reverse proxy and the only thing that may
    # reach this port. The add-on has no authentication of its own by design.
    allow 172.30.32.0/23;
    deny all;

    # X-Ingress-Path is set by Home Assistant Core (the Supervisor forwards it
    # through) and carries the per-session prefix with no trailing slash. Empty
    # for a request that did not come through ingress, which leaves the app
    # root-served — the same behaviour as port 80.
    sub_filter_once on;
    sub_filter '<head>'
        '<head><script>window.__SAEZURI_BASE__="$http_x_ingress_path";</script>';

    # sub_filter cannot rewrite a compressed body, so no gzip here. And the
    # injected token is per-session: a cached index.html would hand a later
    # session a dead prefix, hence no-store on the document.
    gzip off;
    add_header Cache-Control "no-store" always;

    include /etc/nginx/saezuri-locations.conf;
}
