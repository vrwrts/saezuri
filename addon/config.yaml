name: Saezuri
slug: saezuri
version: 0.14.2
description: Live bird collage for BirdNET-Go, in the AvianVisitors kachō-e style
url: https://github.com/vrwrts/saezuri
image: ghcr.io/vrwrts/saezuri-addon
arch:
  - amd64
  - aarch64
startup: services
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:bird
panel_title: Saezuri
# Off by default; ingress covers the collage itself. An e-ink panel fetching
# /24h.png cannot go through ingress, which requires Home Assistant
# authentication, so that one case needs the port opened by hand.
ports:
  "80/tcp": null
ports_description:
  "80/tcp": Direct web access, only needed for an e-ink panel fetching /24h.png
options:
  generate_max_per_cycle: 4
  calls_max_per_cycle: 4
  frame_width: 800
  frame_height: 480
  frame_bg: "#fcfcfb"
  frame_shadow: true
  publish_debounce_ms: 20000
  aging_interval_ms: 120000
  summary_interval_ms: 1800000
schema:
  # Optional: left empty, Saezuri probes the Supervisor network for a
  # BirdNET-Go app at startup. See DOCS.md.
  birdnetgo_url: url?
  birdnetgo_token: password?
  birdnetgo_extra_hosts: str?
  illustrations_repo: str?
  illustrations_ref: str?
  illustrations_base_url: str?
  gemini_api_key: password?
  generate_max_per_cycle: int(1,64)
  generate_sleep: int(0,600)
  call_providers: str?
  calls_max_per_cycle: int(1,64)
  frame_width: int(100,4000)
  frame_height: int(100,4000)
  frame_bg: match(^#[0-9a-fA-F]{6}$)
  frame_shadow: bool
  frame_windows: str?
  species_dict_locales: str?
  publish_debounce_ms: int(1000,600000)
  aging_interval_ms: int(10000,3600000)
  summary_interval_ms: int(60000,86400000)
