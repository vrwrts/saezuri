name: Release

# Continuous, semver release from main. On every push that touches app code,
# semantic-release inspects the Conventional Commits since the last tag and, if
# there is a releasable change (feat/fix/perf/breaking), creates the git tag
# vX.Y.Z and a GitHub Release with auto-generated notes. The image build is
# chained into the same run (publish-image job) rather than relying on the tag
# event, because a tag pushed by GITHUB_TOKEN does not trigger other workflows.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'      # the landing site deploys itself via Cloudflare; never releases the app
      - 'fixtures/**'
      - '.github/**'
      - '**.md'
      # The generation pipeline lives in the saezuri-illustrations repo (versioned there);
      # the app adopts a new one by bumping PIPELINE_VERSION in the Dockerfile, which is a
      # normal releasable app change.
  # Manual trigger, for the case the paths-ignore above creates: a release that
  # failed for an infrastructure reason (a missing credential, a registry outage)
  # can be retried once that is fixed, without inventing a code commit to push.
  # semantic-release is idempotent — with nothing releasable it exits doing nothing.
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the tag + GitHub Release
      issues: write          # semantic-release comments on released issues/PRs
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      major: ${{ steps.semantic.outputs.new_release_major_version }}
      minor: ${{ steps.semantic.outputs.new_release_minor_version }}
    steps:
      # A release pushes a COMMIT to main (see below), which the default
      # GITHUB_TOKEN cannot do while main requires a pull request. RELEASE_TOKEN
      # is a PAT or GitHub App token with a bypass allowance on main; see
      # "Release credentials" in README.md. Checked here rather than left to fail
      # as an opaque `git push` rejection halfway through a release.
      - name: Require the release credential
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set. semantic-release has to push the add-on version bump to main, which GITHUB_TOKEN may not do. See 'Release credentials' in README.md."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # semantic-release needs full history + tags
          # Don't leave GITHUB_TOKEN in .git/config: semantic-release would then
          # push with it instead of RELEASE_TOKEN and be rejected.
          persist-credentials: false
      - uses: cycjimmy/semantic-release-action@v4
        id: semantic
        with:
          # The app's pinned version has to be bumped in the release commit:
          # the app store reads addon/config.yaml from main, and a version with
          # no matching published image tag makes the app uninstallable.
          # changelog writes addon/CHANGELOG.md, exec rewrites the two pinned
          # versions, git commits them.
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/exec
            @semantic-release/git
        env:
          # A push authenticated with a PAT DOES trigger workflows, unlike one
          # with GITHUB_TOKEN. The `[skip ci]` in the git plugin's commit message
          # (.releaserc.json) is what stops the release commit from starting a
          # second Release run, so it is load-bearing now, not cosmetic.
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}

  publish-image:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4          # triggering SHA == the released, tagged commit
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.release.outputs.version }}
            type=raw,value=${{ needs.release.outputs.major }}.${{ needs.release.outputs.minor }}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-addon-image:
    # The Home Assistant app is a thin wrapper around the image above, so it
    # can only be built once that image exists at this exact version.
    needs: [release, publish-image]
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # The triggering SHA, i.e. before semantic-release's version-bump commit.
      # Fine: the wrapper's version comes from the job output below, and neither
      # config.yaml nor build.yaml is baked into the image.
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: addon
          platforms: linux/amd64,linux/arm64
          push: true
          # Pinned to the release just published, never `latest`: an app
          # updated by the Supervisor must get the application code it claims to.
          build-args: |
            BUILD_FROM=ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}-addon:${{ needs.release.outputs.version }}
            ghcr.io/${{ github.repository }}-addon:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
