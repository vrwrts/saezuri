name: Preview image

# Publishes a throwaway multi-arch image for feature branches, so a change can be
# installed on a real device (e.g. a Raspberry Pi) before it merges. release.yml
# still owns the published :latest / :X.Y.Z images on main; this never runs there.
# The image is tagged with the (sanitised) branch name, e.g.
#   ghcr.io/vrwrts/saezuri:on-demand-image-generation
# Note: the package is private by default — either `docker login ghcr.io` on the
# device, or make the package public in GHCR settings, to pull it.
on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - 'site/**'
      - 'fixtures/**'
      - '**.md'

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
