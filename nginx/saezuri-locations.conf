# Everything Saezuri serves, shared verbatim by every server block: the
# standalone port-80 listener (nginx/default.conf.template) and the Home
# Assistant ingress listener (addon/nginx/ingress.conf). Shared rather than
# duplicated because the caching and 404-vs-SPA-fallback policy below is subtle,
# and a block missing from one copy silently hands the browser index.html where
# it expects JSON.

# Hashed build assets + cutouts: cache hard.
location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
}

# Mutable, service-published artifacts. `no-cache` = always revalidate
# (cheap 304s via nginx's ETag/Last-Modified), so a regenerated file is never
# served stale — the fix for viewers seeing new art minutes apart. A missing
# file 404s cleanly (the app falls back to its built-in manifest / an empty
# snapshot) rather than falling through to the SPA index.html.
location = /layout-manifest.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}
location = /snapshot.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}
# Cached reference calls are described here; the audio itself lives under
# /assets/calls/ and is covered by the immutable block above (its URLs carry
# a ?v= content hash). Without this exact-match block a deployment that has
# acquired nothing yet would fall through to the SPA index.html instead of
# 404ing, and the browser would parse HTML as JSON.
location = /calls-manifest.json {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# Published species-name dictionaries (index.json + one <locale>.json each). The
# browser reads these to localize display names. `no-cache` = revalidate (cheap
# 304s), so a republished dictionary is never served stale; a missing file 404s
# cleanly (the app falls back to the station's own names).
location /species-dict/ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# Rendered e-ink frames (written by the refresh service). Regex so it beats
# the SPA fallback below; a missing frame 404s instead of returning
# index.html, and `/7d` (no .png) still routes to the app.
location ~ ^/(1h|12h|24h|7d|all)\.png$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
}

# Drop the trailing slash on a window route. The bundle's asset URLs are
# relative (Vite `base: './'`, so the app tolerates being served from an
# unknown path prefix under Home Assistant ingress), and relative resolution
# from `/24h/` would look for `/24h/assets/…`. $http_x_ingress_path is empty
# unless we are behind ingress, where it carries the per-session prefix that
# the redirect target has to keep.
location ~ ^/(1h|12h|24h|7d|all)/$ {
    # Relative Location: nginx would otherwise build an absolute URL from the
    # port it listens on, which is wrong behind a published Docker port and
    # wrong behind ingress. The browser resolves it against the current origin.
    absolute_redirect off;
    return 301 $http_x_ingress_path/$1;
}

# NOTE: Saezuri does NOT proxy the BirdNET-Go API to the browser. All
# BirdNET-Go access is backend-only (the Node refresh service holds the SSE
# stream and publishes the static files above); the browser only ever reads
# this origin's static files. Proxying /api/ here would expose the entire
# BirdNET-Go API (writes included) to anyone who can reach Saezuri — a real
# risk when Saezuri is on the internet but BirdNET-Go is not.

# SPA fallback for client-side routes.
location / {
    try_files $uri $uri/ /index.html;
}
