services:
  saezuri:
    build: .
    image: saezuri:local
    ports:
      - "8080:80"
    environment:
      # Required: base URL of your BirdNET-Go instance, reachable from inside this
      # container. A LAN IP is simplest; a hostname (incl. one behind a reverse
      # proxy / Cloudflare) works too — its host is forwarded upstream as Host+SNI.
      BIRDNETGO_URL: ${BIRDNETGO_URL:?set BIRDNETGO_URL in .env}
      # Optional: token for a PrivateMode instance (used by the refresh service
      # for the API + SSE stream, and injected by nginx on /api/).
      BIRDNETGO_TOKEN: ${BIRDNETGO_TOKEN:-}
      # Optional: on-demand illustration generation (see .env.example). Unset =>
      # display-only: the refresh service still publishes, it just skips
      # generation, so new species stay hidden until art exists.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Throttle between image-API calls (unset => pregen's 6s free-tier default).
      GENERATE_SLEEP: ${GENERATE_SLEEP:-}
      # Cap species generated per pipeline run.
      GENERATE_MAX_PER_CYCLE: ${GENERATE_MAX_PER_CYCLE:-4}
      # --- e-ink frame (/<window>.png) size + look; set to your panel ---
      FRAME_WIDTH: ${FRAME_WIDTH:-800}
      FRAME_HEIGHT: ${FRAME_HEIGHT:-480}
      FRAME_BG: ${FRAME_BG:-#fcfcfb}
    # Persist generated illustrations across upgrades so the Gemini calls aren't
    # re-spent. The layout manifest is rebuilt from them at startup. Harmless to
    # keep even if you don't generate art (it just holds the fallback silhouette).
    # (snapshot.json + /<window>.png frames live outside the volume — regenerated at start.)
    volumes:
      - saezuri-illustrations:/usr/share/nginx/html/assets/illustrations
    restart: unless-stopped

    # --- If BirdNET-Go also runs in Docker on this host (recommended) ---
    # Share its network and set BIRDNETGO_URL to the service name + INTERNAL port
    # (the right side of BirdNET-Go's `ports:`, usually 8080), e.g.
    # BIRDNETGO_URL=http://birdnet-go:8080. Traffic stays on the Docker network —
    # no DNS, no LAN IP that changes, no round-trip out to Cloudflare. Find the
    # network name with:
    #   docker inspect <birdnet-go-container> --format '{{json .NetworkSettings.Networks}}'
    # networks: [birdnet]
    #
    # --- Or keep a hostname but pin it to the LAN IP ---
    # So the container resolves it locally instead of over the internet:
    # extra_hosts:
    #   - "birdnet.apps.example.lan:192.168.1.10"

# Uncomment together with `networks: [birdnet]` above to join BirdNET-Go's
# existing Docker network (created by its own compose project):
# networks:
#   birdnet:
#     external: true
#     name: birdnet-go_default   # the network BirdNET-Go's compose created
volumes:
  saezuri-illustrations:
